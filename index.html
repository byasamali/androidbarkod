<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Okuyan versiyonnn Okuyucu</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f5f9; color: #172033; padding: 16px; }
    .panel { background: white; border: 1px solid #e2e7ef; border-radius: 16px; padding: 16px; margin: 12px auto; max-width: 600px; box-shadow: 0 3px 12px rgba(0,0,0,0.05); }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; display: none; }
    button { border: 0; border-radius: 11px; padding: 12px 18px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    .primary { background: #1d4ed8; color: white; }
    .secondary { background: #e8edf5; color: #172033; }
    .danger { background: #fee4e2; color: #b42318; }
    .list-head { display: flex; justify-content: space-between; align-items: center; }
    ol { padding-left: 20px; max-height: 200px; overflow-y: auto; }
    li { padding: 6px 0; border-bottom: 1px solid #edf0f5; word-break: break-all; }
  </style>
</head>
<body>
<main style="max-width: 600px; margin: 0 auto;">
  <h1>⚡ Seri Barkod Okuyucu</h1>

  <section class="panel">
    <div id="reader"></div>
    <button id="startBtn" class="primary" onclick="startScanner()">Kamerayı Aç ve Okumaya Başla</button>
    <button id="stopBtn" class="secondary" onclick="stopScanner()" style="display:none;">Kamerayı Kapat</button>
    <p id="status" style="font-size:0.9rem; color:#667085; text-align:center; margin-top:10px;">Kamerayı açmak için dokunun.</p>
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>Okunanlar</h2>
      <span id="count">0 adet</span>
    </div>
    <ol id="list"></ol>
    <div style="display: flex; gap: 10px;">
      <button id="downloadBtn" class="primary" onclick="downloadTxt()" disabled>TXT İndir</button>
      <button class="danger" onclick="clearList()">Temizle</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  let html5QrCode;
  let codes = [];
  let lastScanned = "";
  let lastTime = 0;

  async function startScanner() {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("reader").style.display = "block";
    document.getElementById("status").textContent = "Kamera başlatılıyor...";

    try {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 20, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          const now = Date.now();
          // Aynı barkodun 1.5 saniye içinde üst üste eklenmesini engelle, seri geçişe izin ver
          if (decodedText !== lastScanned || (now - lastTime > 1500)) {
            codes.unshift(decodedText); // En son okunanı en üste ekle
            lastScanned = decodedText;
            lastTime = now;
            updateUI();
            
            // Kısa bir titreşim geri bildirimi (destekleyen cihazlarda hızlı okunduğunu gösterir)
            if (navigator.vibrate) navigator.vibrate(50);
          }
        },
        (errorMessage) => {}
      );

      document.getElementById("stopBtn").style.display = "block";
      document.getElementById("status").textContent = "Kamerayı barkoda tutun, arka arkaya okutabilirsiniz.";
    } catch (err) {
      document.getElementById("startBtn").style.display = "block";
      document.getElementById("reader").style.display = "none";
      document.getElementById("status").textContent = "Kamera açılamadı. İzinleri kontrol edin.";
    }
  }

  async function stopScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      await html5QrCode.stop();
    }
    document.getElementById("reader").style.display = "none";
    document.getElementById("stopBtn").style.display = "none";
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("status").textContent = "Kamera kapatıldı.";
  }

  function updateUI() {
    const listEl = document.getElementById("list");
    listEl.replaceChildren();
    codes.forEach(code => {
      const li = document.createElement("li");
      li.textContent = code;
      listEl.append(li);
    });
    document.getElementById("count").textContent = codes.length + " adet";
    document.getElementById("downloadBtn").disabled = codes.length === 0;
  }

  function clearList() {
    if (confirm("Liste temizlensin mi?")) {
      codes = [];
      updateUI();
    }
  }

  function downloadTxt() {
    const blob = new Blob([codes.join("\n") + "\n"], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "seri-barkodlar.txt";
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
