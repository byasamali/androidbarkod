<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seri Barkod Okuyucu - v7.0</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f5f9; color: #172033; padding: 16px; }
    .panel { background: white; border: 1px solid #e2e7ef; border-radius: 16px; padding: 16px; margin: 12px auto; max-width: 600px; box-shadow: 0 3px 12px rgba(0,0,0,0.05); }
    video { width: 100%; max-height: 320px; object-fit: cover; background: #000; border-radius: 12px; display: none; }
    button { border: 0; border-radius: 11px; padding: 12px 18px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    .primary { background: #1d4ed8; color: white; }
    .secondary { background: #e8edf5; color: #172033; }
    .danger { background: #fee4e2; color: #b42318; }
    .list-head { display: flex; justify-content: space-between; align-items: center; }
    ol { padding-left: 20px; max-height: 200px; overflow-y: auto; }
    li { padding: 6px 0; border-bottom: 1px solid #edf0f5; word-break: break-all; }
  </style>
</head>
<body>
<main style="max-width: 600px; margin: 0 auto;">
  <h1>⚡ Seri Barkod Okuyucu (v4.0)</h1>

  <section class="panel">
    <video id="video" playsinline muted></video>
    <button id="startBtn" class="primary" onclick="startScanner()">Kamerayı Aç ve Okumaya Başla</button>
    <button id="stopBtn" class="secondary" onclick="stopScanner()" style="display:none;">Kamerayı Kapat</button>
    <p id="status" style="font-size:0.9rem; color:#667085; text-align:center; margin-top:10px;">Kamerayı açmak için dokunun.</p>
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>Okunanlar</h2>
      <span id="count">0 adet</span>
    </div>
    <ol id="list"></ol>
    <div style="display: flex; gap: 10px;">
      <button id="downloadBtn" class="primary" onclick="downloadTxt()" disabled>TXT İndir</button>
      <button class="danger" onclick="clearList()">Temizle</button>
    </div>
  </section>
</main>

<script type="module">
  import { BrowserMultiFormatReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

  const video = document.getElementById("video");
  const reader = new BrowserMultiFormatReader();
  let controls = null;
  let codes = [];
  let lastScanned = "";
  let lastTime = 0;
  let audioCtx = null;

  function playBeep() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = "sine";
      osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
  }

  window.startScanner = async function() {
    document.getElementById("startBtn").style.display = "none";
    video.style.display = "block";
    document.getElementById("status").textContent = "Kamera başlatılıyor...";

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    try {
      controls = await reader.decodeFromVideoDevice(
        undefined,
        video,
        (result, error) => {
          if (result) {
            const text = result.getText();
            const now = Date.now();
            if (text !== lastScanned || (now - lastTime > 1500)) {
              codes.unshift(text);
              lastScanned = text;
              lastTime = now;
              updateUI();
              playBeep();
              if (navigator.vibrate) navigator.vibrate(50);
            }
          }
        }
      );

      document.getElementById("stopBtn").style.display = "block";
      document.getElementById("status").textContent = "Barkodu kameraya hizalayın, otomatik okuyacaktır.";
    } catch (err) {
      document.getElementById("startBtn").style.display = "block";
      video.style.display = "none";
      document.getElementById("status").textContent = "Kamera açılamadı: " + (err?.message || "İzin hatası");
    }
  }

  window.stopScanner = async function() {
    if (controls) {
      controls.stop();
      controls = null;
    }
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
    video.style.display = "none";
    document.getElementById("stopBtn").style.display = "none";
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("status").textContent = "Kamera kapatıldı.";
  }

  function updateUI() {
    const listEl = document.getElementById("list");
    listEl.replaceChildren();
    codes.forEach(code => {
      const li = document.createElement("li");
      li.textContent = code;
      listEl.append(li);
    });
    document.getElementById("count").textContent = codes.length + " adet";
    document.getElementById("downloadBtn").disabled = codes.length === 0;
  }

  window.clearList = function() {
    if (confirm("Liste temizlensin mi?")) {
      codes = [];
      updateUI();
    }
  }

  window.downloadTxt = function() {
    const blob = new Blob([codes.join("\n") + "\n"], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "seri-barkodlar.txt";
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
